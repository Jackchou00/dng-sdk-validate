name: Build dng_validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Enter a tag to publish a release; leave blank to build only'
        required: false
        type: string

permissions:
  contents: read

env:
  DNG_SDK_VERSION: '1.7.1'
  DNG_SDK_BUILD: '2724'

jobs:
  macos:
    name: macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project dng_sdk/projects/mac/dng_validate.xcodeproj \
            -target "dng_validate release" \
            -configuration Default \
            build

      - name: Locate and verify binary
        id: locate
        run: |
          settings=$(xcodebuild \
            -project dng_sdk/projects/mac/dng_validate.xcodeproj \
            -target "dng_validate release" \
            -configuration Default \
            -showBuildSettings 2>/dev/null)
          dir=$(printf '%s\n' "$settings" | awk -F' = ' '/^ *TARGET_BUILD_DIR =/{print $2; exit}')
          name=$(printf '%s\n' "$settings" | awk -F' = ' '/^ *FULL_PRODUCT_NAME =/{print $2; exit}')
          bin="$dir/$name"
          test -x "$bin"
          lipo -archs "$bin" | grep -q x86_64
          lipo -archs "$bin" | grep -q arm64
          echo "binary=$bin" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          bin="${{ steps.locate.outputs.binary }}"
          set +e
          out=$("$bin" 2>&1)
          rc=$?
          set -e
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q "dng_validate, version $DNG_SDK_VERSION"
          out=$("$bin" sample_files/05_PGTM2_unsigned8.dng)
          printf '%s\n' "$out" | grep -q "Validation complete"
          out=$("$bin" sample_files/02_jxl_linear_raw_float.dng)
          printf '%s\n' "$out" | grep -q "Validation complete"

      - name: Package
        run: |
          mkdir dist
          cp "${{ steps.locate.outputs.binary }}" dist/dng_validate
          cd dist
          zip ../dng_validate-macos-universal.zip dng_validate

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dng_validate-macos-universal.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild dng_sdk\projects\win\dng_validate.sln `
            -m `
            -p:Configuration="Validate Release" `
            -p:Platform=x64 `
            -p:VisualStudioVersion=17.0 `
            -v:minimal `
            -nologo

      - name: Locate binary
        id: locate
        shell: pwsh
        run: |
          $exe = "dng_sdk\targets\win\release64_x64\dng_validate.exe"
          if (-not (Test-Path $exe)) {
            $found = Get-ChildItem -Recurse -Filter dng_validate.exe |
                     Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
            if (-not $found) { throw "dng_validate.exe not found" }
            $exe = $found.FullName
          }
          "binary=$exe" >> $env:GITHUB_OUTPUT

      - name: Smoke test
        shell: pwsh
        run: |
          $bin = "${{ steps.locate.outputs.binary }}"
          $out = & $bin 2>&1
          if ($LASTEXITCODE -ne 1) { throw "Expected exit code 1 when run without arguments" }
          if (($out | Out-String) -notmatch [regex]::Escape("dng_validate, version $env:DNG_SDK_VERSION")) {
            throw "Version banner missing"
          }
          foreach ($sample in @("sample_files\05_PGTM2_unsigned8.dng", "sample_files\02_jxl_linear_raw_float.dng")) {
            $out = & $bin $sample 2>&1
            if ($LASTEXITCODE -ne 0 -or ($out | Out-String) -notmatch "Validation complete") {
              throw "Validation failed: $sample"
            }
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ steps.locate.outputs.binary }}" dist\dng_validate.exe
          Compress-Archive -Path dist\dng_validate.exe -DestinationPath dng_validate-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dng_validate-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, windows]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.zip --clobber
          else
            gh release create "$TAG" \
              --title "DNG SDK $DNG_SDK_VERSION (build $DNG_SDK_BUILD) — dng_validate" \
              --notes-file .github/release-notes.md \
              artifacts/*.zip
          fi
          gh release view "$TAG" --json url,tagName,assets
